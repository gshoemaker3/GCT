name: Build Executables

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Prevents multiple runs of the same workflow from conflicting
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install pdoc

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --paths src --name gct src/gct/main.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gct
          path: dist/

      - name: Generate API Docs
        run: pdoc --output-dir docs ./src/gct

      - name: Upload API Docs
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: gct
          path: dist/
      - name: Make executable
        run: chmod +x dist/gct
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: pip install pytest
      - name: Run integration tests
        run: pytest tests/integration/ -v

  publish-release:
    needs: [integration-test]
    runs-on: ubuntu-latest
    # This ensures release only happens on push to main, not on PRs
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/gct/gct
          tag_name: v0.0.${{ github.run_number }}
          generate_release_notes: true

  deploy-docs:
    needs: [integration-test]
    runs-on: ubuntu-latest
    # This ensures deployment only happens on push to main, not on PRs
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
