name: Build Executables

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    # name: Build on ${{ matrix.os }}
    # runs-on: ${{ matrix.os }}
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     os: [ubuntu-latest, windows-latest, macos-latest]
    name: Build Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --paths src --name tool-${{ matrix.os }} src/gct/main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gct
          path: dist/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build  # waits for build job to complete successfully

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: gct
          path: dist/

      - name: List dist contents  # add this temporarily
        run: ls -la dist/
      - name: List dist contents  # add this temporarily
        run: ls -la dist/tools-
      - name: List dist contents 2 # add this temporarily
        run: ls -la

      - name: Make executable
        run: chmod +x dist/gct

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: pip install pytest

      - name: Run integration tests
        run: pytest tests/integration/ -v
