name: actions

on:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Scan
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  sast-scan:
    name: SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install bandit
        run: pip install -e ".[dev]"

      - name: Run SAST Scan
        run: bandit -c pyproject.toml -r .

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: install safety
        run: pip install -e ".[dev]"

      - name: Run Scan
        run: safety check

  linting:
    name: linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install black
        run: pip install -e ".[dev]"

      - name: Run Linter
        run: black --check --diff .

  unit-tests:
    needs: [secret-scan, sast-scan, dependency-scan]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    name: Unit_Tests
    runs-on: ${{ matrix.os}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pytest
        run: pip install -e ".[dev]"

      - name: Run Unit tests
        run: pytest tests/unit_tests

  # call-build:
  #   needs: [unit-tests]
  #   uses: ./.github/workflows/build.yaml
